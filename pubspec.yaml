name: moipz_flutter
description: "AI 코디 추천과 가상 피팅을 제공하는 개인 옷장 관리 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# 앱 런처 아이콘 설정 (flutter_launcher_icons)
#  ★ image_path를 본인이 넣어둔 실제 아이콘 파일 경로로 바꾸세요.
#    (정사각형 PNG 1024x1024 권장)
flutter_launcher_icons:
  android: true        # 발표용 안드로이드 에뮬레이터 위주로 적용
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true